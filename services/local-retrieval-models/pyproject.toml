[project]
name = "local-retrieval-models"
version = "0.1.0"
description = "Bounded local Qwen3 embedding and reranking service for SHUEHO external data."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "huggingface-hub>=0.34,<2",
  "numpy>=2.1,<3",
  "python-dotenv>=1.1,<2",
  "sentence-transformers>=5.1,<6",
  "torch>=2.7,<3",
  "transformers>=4.51,<6",
  "uvicorn[standard]>=0.35,<1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_retrieval_models"]
