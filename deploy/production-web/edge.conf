pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
  access_log off;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  limit_req_zone $binary_remote_addr zone=requests:10m rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=connections:10m;
  server {
    listen 8080;
    server_name _;
    client_max_body_size 64k;
    client_body_timeout 30s;
    limit_req zone=requests burst=100 nodelay;
    limit_req_status 429;
    limit_conn connections 200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_read_timeout 1800s;
    add_header X-Content-Type-Options nosniff always;
    location = /api/internal { return 404; }
    location ^~ /api/internal/ { return 404; }
    location ~ ^/api/agent/threads/[^/]+/attachments$ {
      client_max_body_size 6m;
      proxy_pass http://control:3000;
    }
    location / { proxy_pass http://control:3000; }
  }
}
