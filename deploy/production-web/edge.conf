pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  access_log off;
  # The loopback-published edge is reached only by the managed host Tunnel.
  # Restore its client address before applying per-client concurrency limits.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 172.30.87.1;
  real_ip_header CF-Connecting-IP;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_req_zone $binary_remote_addr zone=requests:10m rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=connections:10m;
  server {
    set $commerce_control_origin http://control:3000;
    listen 8080;
    server_name _;
    client_max_body_size 64k;
    client_body_timeout 30s;
    limit_req zone=requests burst=100 nodelay;
    limit_req_status 429;
    limit_conn connections 200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_read_timeout 1800s;
    add_header X-Content-Type-Options nosniff always;
    location = /api/internal { return 404; }
    location ^~ /api/internal/ { return 404; }
    location = /api/products/imports {
      client_max_body_size 6m;
      proxy_pass $commerce_control_origin;
    }
    location ~ ^/api/agent/threads/[^/]+/attachments$ {
      client_max_body_size 6m;
      proxy_pass $commerce_control_origin;
    }
    location / { proxy_pass $commerce_control_origin; }
  }
}
