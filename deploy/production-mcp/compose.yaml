name: commerce-pilot-mcp

x-app: &app
  image: ${COMMERCE_MCP_IMAGE:?Set a release image}
  restart: unless-stopped
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  pids_limit: 128
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  database:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    env_file: ${COMMERCE_CONFIG_DIR:?}/database.env
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/tls/database.crt, -c, ssl_key_file=/run/tls/database.key, -c, ssl_ca_file=/run/tls/ca.crt]
    volumes:
      - database:/var/lib/postgresql/data
      - ${COMMERCE_CONFIG_DIR}/database-tls:/run/tls:ro
    networks: [backend]
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U commerce_pilot -d commerce_pilot"]
      interval: 5s
      retries: 30
    logging: *logging

  warehouse-database:
    image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    env_file: ${COMMERCE_CONFIG_DIR}/warehouse-database.env
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/tls/database.crt, -c, ssl_key_file=/run/tls/database.key, -c, ssl_ca_file=/run/tls/ca.crt]
    volumes:
      - warehouse-database:/var/lib/postgresql/data
      - ${COMMERCE_CONFIG_DIR}/warehouse-database-tls:/run/tls:ro
    networks: [backend]
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U external_data_owner -d commerce_external_data"]
      interval: 5s
      retries: 30
    logging: *logging

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2@sha256:9c1e1afc2bda921b35025e21c72ec6e392266995aa35ad6a47887363592718be
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes: [elasticsearch:/usr/share/elasticsearch/data]
    networks: [backend]
    mem_limit: 3g
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow"]
      interval: 10s
      retries: 40
    logging: *logging

  control:
    <<: *app
    env_file: ${COMMERCE_CONFIG_DIR}/control.env
    working_dir: /app/apps/web
    environment: { NEXT_DIST_DIR: .next-build }
    command: [node, /app/node_modules/next/dist/bin/next, start, -H, 0.0.0.0, -p, "3000"]
    volumes: ["${COMMERCE_CONFIG_DIR}/ca.crt:/run/tls/ca.crt:ro"]
    networks: [backend]
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      database: { condition: service_healthy }

  warehouse:
    <<: *app
    env_file: ${COMMERCE_CONFIG_DIR}/warehouse.env
    command: [node, apps/external-data/dist/server.js]
    volumes: ["${COMMERCE_CONFIG_DIR}/ca.crt:/run/tls/ca.crt:ro"]
    networks: [backend, egress]
    mem_limit: 2g
    cpus: 1.5
    depends_on:
      warehouse-database: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8791/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      start_period: 180s
      retries: 10

  internal-tls:
    image: ${COMMERCE_PROXY_IMAGE:?Set a release proxy image}
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - ./internal-tls.conf:/etc/nginx/nginx.conf:ro
      - ${COMMERCE_CONFIG_DIR}/internal-tls:/run/tls:ro
    networks: [backend]
    mem_limit: 64m
    depends_on:
      warehouse: { condition: service_healthy }
    logging: *logging

  public-mcp:
    <<: *app
    env_file: ${COMMERCE_CONFIG_DIR}/public-mcp.env
    volumes: ["${COMMERCE_CONFIG_DIR}/ca.crt:/run/tls/ca.crt:ro"]
    networks: [backend]
    mem_limit: 512m
    cpus: 1.0
    depends_on: [control, internal-tls]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10

  edge:
    image: ${COMMERCE_PROXY_IMAGE:?Set a release proxy image}
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes: [./edge.conf:/etc/nginx/nginx.conf:ro]
    ports: ["127.0.0.1:18087:8080"]
    networks: [backend, egress]
    mem_limit: 64m
    depends_on:
      public-mcp: { condition: service_healthy }
    logging: *logging

  # Only this small proxy shares the host network, to reach the SSH loopback
  # listener. It exposes a dedicated Unix socket, never a host TCP listener.
  model-relay:
    image: ${COMMERCE_PROXY_IMAGE:?Set a release proxy image}
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    network_mode: host
    volumes:
      - ./model-relay.conf:/etc/nginx/nginx.conf:ro
      - ${COMMERCE_CONFIG_DIR}/../run/model:/run/model
    mem_limit: 64m
    logging: *logging

  model-client:
    image: ${COMMERCE_PROXY_IMAGE:?Set a release proxy image}
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - ./model-client.conf:/etc/nginx/nginx.conf:ro
      - ${COMMERCE_CONFIG_DIR}/../run/model:/run/model:ro
    networks: [backend]
    mem_limit: 64m
    logging: *logging

networks:
  backend:
    internal: true
  egress:
    ipam:
      config: [{ subnet: 172.30.87.0/24, gateway: 172.30.87.1 }]

volumes:
  database:
  warehouse-database:
  elasticsearch:
