pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  access_log off;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_req_zone $binary_remote_addr zone=requests:1m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=connections:1m;
  server {
    listen 8080;
    server_name _;
    client_max_body_size 64k;
    client_body_timeout 15s;
    limit_req zone=requests burst=30 nodelay;
    limit_req_status 429;
    limit_conn connections 60;
    location = /health {
      proxy_set_header Host public-mcp:8790;
      proxy_pass http://public-mcp:8790/health;
    }
    location = /mcp {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_next_upstream off;
      proxy_read_timeout 45s;
      add_header X-Accel-Buffering no always;
      add_header Cache-Control no-store always;
      proxy_pass http://public-mcp:8790;
    }
    location / { return 404; }
  }
}
