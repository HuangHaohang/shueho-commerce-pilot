services:
  postgres:
    image: postgres:16-alpine
    container_name: commerce-pilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: commerce_pilot
      POSTGRES_USER: commerce_pilot
      POSTGRES_PASSWORD: commerce_pilot_dev
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce_pilot -d commerce_pilot"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - commerce-pilot-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  commerce-pilot-postgres-data:
